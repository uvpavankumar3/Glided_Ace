<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Gilded Ace — Luck, Location, or a Leak?</title>
<style>
:root{
  color-scheme:light;
  --surface-0:#f4f3f0; --surface-1:#fcfcfb; --surface-2:#f0efec; --border:#dddcd6; --grid:#e8e7e2;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#76756f;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --muted-series:#b9b8b2;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --accent:#2a78d6; --band:rgba(42,120,214,.08); --band2:rgba(235,104,52,.10);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --surface-0:#121211; --surface-1:#1a1a19; --surface-2:#242422; --border:#383835; --grid:#2c2c2a;
    --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#9a998f;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --muted-series:#5b5a55;
    --band:rgba(57,135,229,.14); --band2:rgba(217,89,38,.16);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface-0:#121211; --surface-1:#1a1a19; --surface-2:#242422; --border:#383835; --grid:#2c2c2a;
  --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#9a998f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --muted-series:#5b5a55;
  --band:rgba(57,135,229,.14); --band2:rgba(217,89,38,.16);
}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-0);color:var(--text-primary);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:20;background:var(--surface-1);border-bottom:1px solid var(--border)}
.hwrap{max-width:1280px;margin:0 auto;padding:10px 20px 0}
.title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.title h1{font-size:18px;margin:0}
.title .sub{color:var(--text-secondary);font-size:13px}
.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:8px 0}
.controls label{font-size:12px;color:var(--text-secondary);display:flex;gap:6px;align-items:center}
select,input[type=search]{font:inherit;font-size:13px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface-1);color:var(--text-primary)}
button{font:inherit;font-size:12px;padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface-1);color:var(--text-primary);cursor:pointer}
nav{display:flex;gap:2px;overflow-x:auto}
nav a{padding:8px 12px;text-decoration:none;color:var(--text-secondary);border-bottom:2px solid transparent;white-space:nowrap;font-size:13px}
nav a.on{color:var(--text-primary);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1280px;margin:0 auto;padding:18px 20px 60px}
section.page{display:none}
section.page.on{display:block}
h2{font-size:20px;margin:4px 0 4px}
h3{font-size:15px;margin:0 0 2px}
.lede{color:var(--text-secondary);max-width:900px;margin:0 0 14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(480px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.card .note{color:var(--text-muted);font-size:12px;margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.kpi .l{font-size:12px;color:var(--text-secondary)}
.kpi .v{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11px;color:var(--text-muted)}
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);margin:4px 0 2px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.legend i.box{height:10px;width:10px}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;border-bottom:1px solid var(--grid);text-align:left;vertical-align:top}
th{color:var(--text-secondary);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--surface-1)}
td.n,th.n{text-align:right}
td.id{white-space:nowrap}
.tblwrap.full{max-height:none}
.tblwrap{max-height:420px;overflow:auto}
.chip{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;margin:1px 2px 1px 0;background:var(--surface-2);color:var(--text-secondary);white-space:nowrap}
.v-inspect{color:var(--critical);font-weight:650}
.v-replace{color:var(--serious);font-weight:650}
.v-keep{color:var(--text-secondary)}
.v-retired{color:var(--text-muted)}
.st{font-weight:650}
details{margin-top:8px}
summary{cursor:pointer;color:var(--text-secondary);font-size:12px}
.tip{position:fixed;pointer-events:none;z-index:50;background:var(--surface-1);border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.15);max-width:300px;display:none}
.tip b{font-weight:650}
.qcard{display:flex;flex-direction:column;gap:6px}
.qcard .q{font-size:12px;color:var(--text-secondary);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.qcard .a{font-size:14px}
.answer{font-size:16px;max-width:980px;margin:6px 0 16px;line-height:1.5}
.action{border-left:4px solid var(--accent)}
.action dl{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;margin:8px 0 0}
.action dt{color:var(--text-secondary);font-size:12px;font-weight:600}
.action dd{margin:0}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:12px;background:var(--surface-2);margin-left:6px}
.warnbox{border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:8px 12px;font-size:12.5px;color:var(--text-secondary)}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--text-muted)}
.small{font-size:12px}
@media (forced-colors: active){.chip{border:1px solid CanvasText}}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="title"><h1>The Gilded Ace — Luck, Location, or a Leak?</h1>
    <span class="sub">Fictional 300-machine casino · synthetic data, Jan 1 – Jun 30, 2025 · Dashboard Royale, TAMU Datathon 2026</span></div>
  <div class="controls">
    <label>Analysis period <select id="m0"></select> to <select id="m1"></select></label>
    <span class="small muted" id="periodNote"></span>
    <button id="themeBtn" title="Toggle light/dark">Light / dark</button>
  </div>
  <nav id="nav"></nav>
</div></header>
<main id="main"></main>
<div class="tip" id="tip"></div>
<script id="data" type="application/json">__DATA__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = s => document.querySelector(s);
const el = (t, a = {}, h = "") => { const e = document.createElement(t); for (const k in a) e.setAttribute(k, a[k]); if (h) e.innerHTML = h; return e; };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmt$ = (v, d = 0) => v == null || isNaN(v) ? "—" : (v < 0 ? "−" : "") + "$" + Math.abs(v).toLocaleString("en-US", {maximumFractionDigits: d, minimumFractionDigits: d});
const fmtK = v => { if (v == null || isNaN(v)) return "—"; const a = Math.abs(v), s = v < 0 ? "−" : ""; return a >= 1e6 ? s + "$" + (a / 1e6).toFixed(a >= 1e7 ? 1 : 2) + "M" : a >= 1e3 ? s + "$" + (a / 1e3).toFixed(a >= 1e5 ? 0 : 1) + "k" : s + "$" + a.toFixed(0); };
const fmtN = (v, d = 0) => v == null || isNaN(v) ? "—" : v.toLocaleString("en-US", {maximumFractionDigits: d, minimumFractionDigits: d});
const pct = (v, d = 1) => v == null || isNaN(v) || !isFinite(v) ? "—" : (v * 100).toFixed(d) + "%";
const sgn = (v, d = 1) => v == null || isNaN(v) ? "—" : (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(d);
const sum = a => a.reduce((s, x) => s + (x || 0), 0);
const NS = "http://www.w3.org/2000/svg";

/* ---------------- period state ---------------- */
const M = D.months, ML = {"2025-01":"Jan","2025-02":"Feb","2025-03":"Mar","2025-04":"Apr","2025-05":"May","2025-06":"Jun"};
const S = {m0: 0, m1: M.length - 1, zone: "", bank: "", group: "All tracked players"};
const inP = mi => mi >= S.m0 && mi <= S.m1;
const dIn = d => { const m = M.indexOf(d.slice(0, 7)); return m >= 0 && inP(m); };
const pDays = () => { let n = 0; for (let i = S.m0; i <= S.m1; i++) n += D.period_days[M[i]]; return n; };
const pEnd = () => { const m = M[S.m1]; const [y, mo] = m.split("-").map(Number); return new Date(Date.UTC(y, mo, 0)).toISOString().slice(0, 10); };
const pStart = () => M[S.m0] + "-01";
const periodLabel = () => ML[M[S.m0]] + (S.m0 === S.m1 ? "" : "–" + ML[M[S.m1]]) + " 2025";

/* ---------------- tooltip ---------------- */
const tip = $("#tip");
function showTip(ev, html) { tip.innerHTML = html; tip.style.display = "block"; const x = Math.min(ev.clientX + 14, innerWidth - tip.offsetWidth - 8), y = Math.min(ev.clientY + 14, innerHeight - tip.offsetHeight - 8); tip.style.left = x + "px"; tip.style.top = y + "px"; }
function hideTip() { tip.style.display = "none"; }

/* ---------------- SVG chart helpers ---------------- */
function svg(w, h) { const s = document.createElementNS(NS, "svg"); s.setAttribute("viewBox", `0 0 ${w} ${h}`); s.setAttribute("role", "img"); return s; }
function sv(t, a, parent) { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (parent) parent.appendChild(e); return e; }
function niceTicks(min, max, n = 5) {
  if (min === max) { max = min + 1; }
  const span = max - min, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0))), r = step0 / mag;
  const step = (r >= 5 ? 10 : r >= 2 ? 5 : r >= 1 ? 2 : 1) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];
  for (let v = lo; v <= hi + step / 2; v += step) t.push(+v.toFixed(10));
  return t;
}
function legend(items) {
  const L = el("div", {class: "legend"});
  items.forEach(it => L.appendChild(el("span", {}, `<i class="${it.box ? "box" : ""}" style="background:${it.color};${it.dash ? "background:repeating-linear-gradient(90deg," + it.color + " 0 4px,transparent 4px 7px)" : ""}"></i>${it.name}`)));
  return L;
}
function tableDetails(headers, rows, label = "Show data table") {
  const d = el("details"); d.appendChild(el("summary", {}, label));
  const w = el("div", {class: "tblwrap"}); const t = el("table");
  t.innerHTML = "<thead><tr>" + headers.map(h => `<th>${h}</th>`).join("") + "</tr></thead><tbody>" + rows.map(r => "<tr>" + r.map(c => `<td>${c}</td>`).join("") + "</tr>").join("") + "</tbody>";
  w.appendChild(t); d.appendChild(w); return d;
}
/* line chart: x = array of labels (dates or strings), series = [{name, values, color, dash, width}] */
function lineChart(host, o) {
  host.innerHTML = "";
  const W = o.w || 760, H = o.h || 260, m = {t: 12, r: 16, b: 28, l: 62};
  const xs = o.x, n = xs.length;
  if (o.series.length > 1) host.appendChild(legend(o.series.map(s => ({name: s.name, color: s.color, dash: s.dash}))));
  const all = o.series.flatMap(s => s.values).filter(v => v != null && !isNaN(v));
  let ymin = o.ymin != null ? o.ymin : Math.min(...all), ymax = o.ymax != null ? o.ymax : Math.max(...all);
  if (o.zero) ymin = Math.min(0, ymin);
  const ticks = niceTicks(ymin, ymax, 5); ymin = ticks[0]; ymax = ticks[ticks.length - 1];
  const s = svg(W, H), X = i => m.l + (n <= 1 ? 0 : i * (W - m.l - m.r) / (n - 1)), Y = v => H - m.b - (v - ymin) / (ymax - ymin) * (H - m.t - m.b);
  s.setAttribute("aria-label", o.label || "line chart");
  (o.bands || []).forEach(b => { const i0 = xs.indexOf(b.from), i1 = xs.indexOf(b.to); if (i0 < 0 && i1 < 0) return; const a = i0 < 0 ? 0 : i0, z = i1 < 0 ? n - 1 : i1;
    sv("rect", {x: X(a), y: m.t, width: Math.max(2, X(z) - X(a)), height: H - m.t - m.b, fill: b.color || "var(--band)"}, s);
    const t = sv("text", {x: X(a) + 4, y: m.t + 12, "font-size": 11, fill: "var(--text-secondary)"}, s); t.textContent = b.label; });
  ticks.forEach(t => { sv("line", {x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), stroke: "var(--grid)", "stroke-width": 1}, s);
    const tx = sv("text", {x: m.l - 8, y: Y(t) + 4, "text-anchor": "end", "font-size": 11, fill: "var(--text-muted)"}, s); tx.textContent = (o.yfmt || fmtK)(t); });
  const step = o.xstep || Math.max(1, Math.ceil(n / (o.xticks || 8)));
  for (let i = 0; i < n; i += step) { const tx = sv("text", {x: X(i), y: H - 8, "text-anchor": "middle", "font-size": 11, fill: "var(--text-muted)"}, s); tx.textContent = (o.xfmt || (v => v))(xs[i]); }
  (o.markers || []).forEach(mk => { const i = xs.indexOf(mk.x); if (i < 0) return; sv("line", {x1: X(i), x2: X(i), y1: m.t, y2: H - m.b, stroke: "var(--text-muted)", "stroke-dasharray": "3 3"}, s);
    const t = sv("text", {x: X(i) + 4, y: H - m.b - 6, "font-size": 11, fill: "var(--text-secondary)"}, s); t.textContent = mk.label; });
  o.series.forEach(se => { let d = "", pen = false; se.values.forEach((v, i) => { if (v == null || isNaN(v)) { pen = false; return; } d += (pen ? "L" : "M") + X(i).toFixed(1) + "," + Y(v).toFixed(1); pen = true; });
    sv("path", {d, fill: "none", stroke: se.color, "stroke-width": se.width || 2, "stroke-dasharray": se.dash ? "5 4" : "", "stroke-linejoin": "round", "stroke-linecap": "round"}, s);
    if (se.dots) se.values.forEach((v, i) => { if (v != null) sv("circle", {cx: X(i), cy: Y(v), r: 4, fill: se.color, stroke: "var(--surface-1)", "stroke-width": 2}, s); }); });
  if (o.ref != null) sv("line", {x1: m.l, x2: W - m.r, y1: Y(o.ref), y2: Y(o.ref), stroke: "var(--text-muted)", "stroke-width": 1}, s);
  const cross = sv("line", {y1: m.t, y2: H - m.b, stroke: "var(--text-muted)", "stroke-width": 1, visibility: "hidden"}, s);
  const dots = o.series.map(se => sv("circle", {r: 4, fill: se.color, stroke: "var(--surface-1)", "stroke-width": 2, visibility: "hidden"}, s));
  const hit = sv("rect", {x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: "transparent"}, s);
  hit.addEventListener("mousemove", ev => { const r = s.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width; let i = Math.round((px - m.l) / (W - m.l - m.r) * (n - 1)); i = Math.max(0, Math.min(n - 1, i));
    cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i)); cross.setAttribute("visibility", "visible");
    let h = `<b>${(o.tipx || (v => v))(xs[i], i)}</b>`;
    o.series.forEach((se, k) => { const v = se.values[i]; if (v == null || isNaN(v)) { dots[k].setAttribute("visibility", "hidden"); return; } dots[k].setAttribute("cx", X(i)); dots[k].setAttribute("cy", Y(v)); dots[k].setAttribute("visibility", "visible"); h += `<br><span style="color:${se.color}">●</span> ${se.name}: <b>${(o.yfmtTip || o.yfmt || fmtK)(v)}</b>`; });
    if (o.extraTip) h += o.extraTip(i); showTip(ev, h); });
  hit.addEventListener("mouseleave", () => { cross.setAttribute("visibility", "hidden"); dots.forEach(d => d.setAttribute("visibility", "hidden")); hideTip(); });
  const c = el("div", {class: "chart"}); c.appendChild(s); host.appendChild(c);
  if (o.table !== false) host.appendChild(tableDetails(["", ...o.series.map(s => s.name)], xs.map((x, i) => [(o.xfmt || (v => v))(x), ...o.series.map(se => se.values[i] == null || isNaN(se.values[i]) ? "—" : (o.yfmtTip || o.yfmt || fmtK)(se.values[i]))])));
}
/* vertical bar chart (single or stacked): cats, series=[{name, values, color}] */
function barChart(host, o) {
  host.innerHTML = "";
  const W = o.w || 760, H = o.h || 240, m = {t: 14, r: 12, b: o.rot ? (o.rotB || 70) : 30, l: 62}, n = o.cats.length;
  if (o.series.length > 1) host.appendChild(legend(o.series.map(s => ({name: s.name, color: s.color, box: true}))));
  const tot = o.cats.map((_, i) => o.stack ? sum(o.series.map(s => Math.max(0, s.values[i]))) : Math.max(...o.series.map(s => s.values[i])));
  const mins = o.cats.map((_, i) => Math.min(0, ...o.series.map(s => s.values[i])));
  const ticks = niceTicks(Math.min(0, ...mins), Math.max(...tot) || 1, 5), ymin = ticks[0], ymax = ticks[ticks.length - 1];
  const s = svg(W, H), bw = (W - m.l - m.r) / n, Y = v => H - m.b - (v - ymin) / (ymax - ymin) * (H - m.t - m.b);
  s.setAttribute("aria-label", o.label || "bar chart");
  ticks.forEach(t => { sv("line", {x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), stroke: t === 0 ? "var(--text-muted)" : "var(--grid)"}, s);
    const tx = sv("text", {x: m.l - 8, y: Y(t) + 4, "text-anchor": "end", "font-size": 11, fill: "var(--text-muted)"}, s); tx.textContent = (o.yfmt || fmtK)(t); });
  const ns = o.stack ? 1 : o.series.length, gap = Math.min(bw * 0.28, 18), inner = (bw - gap) / ns;
  o.cats.forEach((c, i) => {
    let base = 0;
    o.series.forEach((se, k) => { const v = se.values[i]; if (v == null) return;
      const x = m.l + i * bw + gap / 2 + (o.stack ? 0 : k * inner), w = Math.max(2, inner - (ns > 1 ? 2 : 0));
      const y0 = o.stack ? Y(base) : Y(0), y1 = o.stack ? Y(base + v) : Y(v); base += o.stack ? v : 0;
      const col = o.colorFn ? o.colorFn(i, k) : se.color;
      const top = Math.min(y0, y1), h = Math.max(1, Math.abs(y1 - y0) - (o.stack ? 2 : 0));
      const r = sv("path", {d: roundTop(x, top, w, h, v >= 0 && (!o.stack || k === o.series.length - 1) ? 4 : 0, v < 0), fill: col}, s);
      r.addEventListener("mousemove", ev => showTip(ev, `<b>${c}</b><br>${o.series.length > 1 ? se.name + ": " : ""}<b>${(o.yfmtTip || o.yfmt || fmtK)(v)}</b>${o.tipExtra ? o.tipExtra(i, k) : ""}`));
      r.addEventListener("mouseleave", hideTip);
    });
    if (o.labels) { const v = o.stack ? tot[i] : o.series[0].values[i]; const t = sv("text", {x: m.l + i * bw + bw / 2, y: Math.min(Y(Math.max(v, 0)), Y(0)) - 4, "text-anchor": "middle", "font-size": 11, fill: "var(--text-secondary)"}, s); t.textContent = (o.labelFmt || o.yfmt || fmtK)(v); }
    const tx = sv("text", {x: m.l + i * bw + bw / 2, y: H - m.b + 14, "text-anchor": o.rot ? "end" : "middle", "font-size": 11, fill: "var(--text-muted)", transform: o.rot ? `rotate(-35 ${m.l + i * bw + bw / 2} ${H - m.b + 14})` : ""}, s); tx.textContent = c;
  });
  const c = el("div", {class: "chart"}); c.appendChild(s); host.appendChild(c);
  if (o.table !== false) host.appendChild(tableDetails(["", ...o.series.map(s => s.name)], o.cats.map((c, i) => [c, ...o.series.map(se => se.values[i] == null || isNaN(se.values[i]) ? "—" : (o.yfmtTip || o.yfmt || fmtK)(se.values[i]))])));
}
function roundTop(x, y, w, h, r, neg) { r = Math.min(r, w / 2, h); if (!r) return `M${x},${y}h${w}v${h}h${-w}z`; if (neg) return `M${x},${y}h${w}v${h - r}q0,${r} ${-r},${r}h${-(w - 2 * r)}q${-r},0 ${-r},${-r}z`; return `M${x},${y + r}q0,${-r} ${r},${-r}h${w - 2 * r}q${r},0 ${r},${r}v${h - r}h${-w}z`; }
/* dot-and-whisker: rows=[{label, exp, lo, hi, act}] horizontal */
function whiskerChart(host, rows, o = {}) {

function readHash() { const [id, qs] = (location.hash || "#overview").slice(1).split("?"); const q = new URLSearchParams(qs || "");

function writeHash(p) { const q = new URLSearchParams(); if (S.m0 !== 0 || S.m1 !== M.length - 1) q.set("p", S.m0 + "-" + S.m1); if (S.zone) q.set("z", S.zone); if (S.bank) q.set("b", S.bank); if (S.group !== "All tracked players") q.set("g", S.group);

  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.p === p));
  document.querySelectorAll("section.page").forEach(s => s.classList.toggle("on", s.id === "p-" + p));
  $("#periodNote").textContent = ["model", "plan", "evidence", "method"].includes(p) ? "(this page uses the fixed Jan–Jun window)" : "";
  const sec = $("#p-" + p); R[p](sec); hideTip(); writeHash(p);
}
addEventListener("hashchange", () => { readHash(); render(); scrollTo(0, 0); });
nav.addEventListener("click", e => { const a = e.target.closest("a"); if (!a) return; e.preventDefault(); writeHash(a.dataset.p); render(); scrollTo(0, 0); });
document.addEventListener("click", e => { const a = e.target.closest("main a[href^='#']"); if (!a) return; e.preventDefault(); writeHash(a.getAttribute("href").slice(1)); render(); scrollTo(0, 0); });
readHash(); render();
</script>
